# Kiro - CI (review 22 Nov): tests, type check + build, Edge Function check, dependency audit.
# Runs on every push and pull request. Needs no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mother/package-lock.json
      - name: Install test tools (fast-check for property-based tests)
        run: npm ci
      - name: Install app dependencies
        working-directory: apps/mother
        run: npm ci
      - name: Tests (care engine, shared server code, app; includes property-based tests)
        run: npm test
      - name: Type check and build the app
        working-directory: apps/mother
        run: npx tsc -b && npx vite build
      - name: Dependency audit (high and critical only)
        working-directory: apps/mother
        run: npm audit --omit=dev --audit-level=high

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check every Edge Function
        working-directory: supabase/functions
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: |
          for f in */index.ts; do
            echo "deno check $f"
            deno check --quiet "$f"
          done
